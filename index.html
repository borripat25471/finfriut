<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fin Fruit Delivery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header class="navbar">
        <div class="logo"><i class="fa-solid fa-utensils"></i> Fin<span>Fruit</span></div>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="ค้นหาเมนูอร่อย..." oninput="searchProducts()">
        </div>
        <div class="cart-btn" onclick="toggleCart()">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-count" id="cartCount">0</span>
        </div>
    </header>

    <section class="hero">
        <div class="hero-text">
            <h1>ฟินกับผลไม้สด ทานอร่อย  <span>ดีต่อสุขภาพ</span></h1>
            <p>รวมฮิตผลไม้ สดใหม่จากสวน ส่งไวทันใจคุณ</p>
        </div>
    </section>

    <main class="container">
        <div class="categories">
            <button class="cat-btn active" onclick="filterCategory('ทั้งหมด', event)">ทั้งหมด</button>
            <button class="cat-btn" onclick="filterCategory('ผลไม้สดตามฤดูกาล', event)">ผลไม้สดตามฤดูกาล</button>
            <button class="cat-btn" onclick="filterCategory('ผลไม้พร้อมทาน', event)">ผลไม้พร้อมทาน</button>
            <button class="cat-btn" onclick="filterCategory('น้ำผลไม้คั้นสด / สมูทตี้', event)">น้ำผลไม้คั้นสด / สมูทตี้</button>
            <button class="cat-btn" onclick="filterCategory('พริกเกลือ / น้ำจิ้มแซ่บ', event)">พริกเกลือ / น้ำจิ้มแซ่บ</button>
            
        </div>

        <div class="product-grid" id="productGrid">
            <!-- Products will be loaded via JavaScript -->
        </div>
    </main>

    <!-- Cart Drawer -->
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3><i class="fa-solid fa-bag-shopping"></i> ตะกร้าของฉัน</h3>
            <span class="close-btn" onclick="toggleCart()">&times;</span>
        </div>
        <div class="cart-items" id="cartItems">
            <p class="empty-msg">ยังไม่มีสินค้าในตะกร้า</p>
        </div>
        <div class="cart-footer">
            <div class="total-price">ราคารวม: <span id="totalPrice">฿0</span></div>
            <button class="checkout-btn" onclick="checkout()">สั่งซื้อสินค้า</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
