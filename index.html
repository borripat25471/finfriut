<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteDash | Modern Food Delivery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header class="navbar">
        <div class="logo"><i class="fa-solid fa-utensils"></i> Fin<span>Fruit</span></div>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="ค้นหาเมนูอร่อย..." oninput="searchProducts()">
        </div>
        <div class="cart-btn" onclick="toggleCart()">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-count" id="cartCount">0</span>
        </div>
    </header>

    <section class="hero">
        <div class="hero-text">
            <h1>อร่อยส่งตรงถึงหน้าบ้าน <span>รวดเร็ว ทันใจ</span></h1>
            <p>คัดสรรเมนูคุณภาพจากร้านดัง พร้อมโปรโมชันพิเศษทุกวัน</p>
        </div>
    </section>

    <main class="container">
        <div class="categories">
            <button class="cat-btn active" onclick="filterCategory('ทั้งหมด', event)">ทั้งหมด</button>
            <button class="cat-btn" onclick="filterCategory('เบอร์เกอร์', event)">เบอร์เกอร์</button>
            <button class="cat-btn" onclick="filterCategory('พาสต้า', event)">พาสต้า</button>
            <button class="cat-btn" onclick="filterCategory('พิซซ่า', event)">พิซซ่า</button>
            <button class="cat-btn" onclick="filterCategory('ของทอด', event)">ของทอด</button>
            <button class="cat-btn" onclick="filterCategory('เครื่องดื่ม', event)">เครื่องดื่ม</button>
            <button class="cat-btn" onclick="filterCategory('ของหวาน', event)">ของหวาน</button>
            <button class="cat-btn" onclick="filterCategory('สลัด', event)">สลัด</button>
        </div>

        <div class="product-grid" id="productGrid">
            <!-- Products will be loaded via JavaScript -->
        </div>
    </main>

    <!-- Cart Drawer -->
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3><i class="fa-solid fa-bag-shopping"></i> ตะกร้าของฉัน</h3>
            <span class="close-btn" onclick="toggleCart()">&times;</span>
        </div>
        <div class="cart-items" id="cartItems">
            <p class="empty-msg">ยังไม่มีสินค้าในตะกร้า</p>
        </div>
        <div class="cart-footer">
            <div class="total-price">ราคารวม: <span id="totalPrice">฿0</span></div>
            <button class="checkout-btn" onclick="checkout()">สั่งซื้อสินค้า</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
